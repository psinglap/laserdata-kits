services:
  iggy:
    image: apache/iggy:0.9.0
    container_name: iggy
    cap_add: [SYS_NICE]
    security_opt: [seccomp:unconfined]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - IGGY_TCP_ADDRESS=0.0.0.0:8090          # listen beyond the container's loopback
      - IGGY_HTTP_ADDRESS=0.0.0.0:3000
      - IGGY_NODE_ADVERTISED_ADDRESS=localhost
    ports: ["8090:8090", "3000:3000"]
  clickhouse:                                  # stands in for the ClickHouse your writers insert into
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      - CLICKHOUSE_USER=lane
      - CLICKHOUSE_PASSWORD=lane
    ports: ["8123:8123"]
