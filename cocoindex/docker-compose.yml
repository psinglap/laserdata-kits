services:
  iggy:
    image: apache/iggy:0.9.0
    container_name: iggy
    cap_add: [SYS_NICE]
    security_opt: [seccomp:unconfined]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - IGGY_TCP_ADDRESS=0.0.0.0:8090          # listen beyond the container's loopback
      - IGGY_HTTP_ADDRESS=0.0.0.0:3000
      - IGGY_NODE_ADVERTISED_ADDRESS=localhost
    ports: ["8090:8090", "3000:3000"]

  # The target CocoIndex's own examples use: Postgres with pgvector. Point --pg-url at your own instead.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - POSTGRES_USER=cocoindex
      - POSTGRES_PASSWORD=cocoindex
      - POSTGRES_DB=cocoindex
    ports: ["5432:5432"]
