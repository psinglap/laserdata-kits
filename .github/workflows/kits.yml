name: kits
on:
  push:
  workflow_dispatch:
jobs:
  kit:
    name: ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        account: [zepto, swiggy, meesho, eternal, rapido, porter, groww, phonepe, razorpay, zerodha, juspay, jiohotstar, sharechat, zee5, moengage, signoz, dream11, the-trade-desk, magnite, braze, pubmatic, klaviyo, attentive, cursor, character-ai, deepgram, vapi, stubhub, doordash, motive, rivian, robinhood, kraken, jump-trading, honeycomb, posthog, sentry, atlassian, netflix, disney, pinterest, discord, conviva]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash ${{ matrix.account }}/ci.sh
